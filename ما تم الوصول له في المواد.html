   <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;

            background: #000000;
            color: #333;
            min-height: 100%;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, rgba(255,255,255,0.2)),
                radial-gradient(2px 2px at 60% 70%, white, rgba(255,255,255,0.2)),
                radial-gradient(1px 1px at 50% 50%, white, rgba(255,255,255,0.2)),
                radial-gradient(1px 1px at 80% 10%, white, rgba(255,255,255,0.2)),
                radial-gradient(2px 2px at 10% 90%, white, rgba(255,255,255,0.2)),
                radial-gradient(1px 1px at 90% 60%, white, rgba(255,255,255,0.2)),
                radial-gradient(1px 1px at 30% 80%, white, rgba(255,255,255,0.2)),
                radial-gradient(2px 2px at 70% 40%, white, rgba(255,255,255,0.2));
            background-repeat: repeat;
            background-size: 200% 200%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            animation: twinkling 4s ease-in-out infinite;
        }

        @keyframes twinkling {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .app-wrapper::before {
            display: none;
        }

        .app-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            overflow-y: auto;
            position: relative;
            z-index: 1;

        /* Header */
        .header {

            color: white;
            margin-bottom: 40px;

        .header h1 {
            font-size: 3rem;

        }

        }

        /* Admin Toggle Button */

            position: fixed;

            z-index: 100;

        }

        .admin-btn {

            color: white;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: 0.3s ease;

        }

        .login-box input {

        }

        .login-box input:focus {
            outline: none;

        }

        .login-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;

        }

        .login-btn {
            padding: 12px 20px;

            font-family: 'Cairo', sans-serif;
            font-weight: 600;

            transition: 0.3s;
        }

        .login-btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);

        }

        .login-btn-submit:hover {

        .login-btn-cancel {

        }

        }

        .login-error.show {

        }

        /* Admin Panel */
        .admin-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0, 0, 0, 0.7);

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));

        .subject-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 25px;

            overflow: hidden;
            animation: cardSlide 0.6s ease-out both;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }

            justify-content: space-between;
            align-items: flex-start;

        .info-label {

            font-weight: 500;
        }

        .info-value {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-section {
            margin-top: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .progress-text {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(3px);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.6));
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;

        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;

            height: 20px;

            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .admin-modal {
                width: 95%;
                padding: 25px;
            }

            .admin-toggle {
                bottom: 20px;
                left: 20px;
            }
        }

        /* Scrollbar Styling */
        .subjects-list::-webkit-scrollbar {
            width: 6px;
        }

        .subjects-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .subjects-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .admin-modal::-webkit-scrollbar {
            width: 6px;
        }

        .admin-modal::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .admin-modal::-webkit-scrollbar-thumb {
            background: #667eea;
        }
    </style>

    <div class="app-wrapper">
     <div class="login-zone" id="loginZone"></div>
     <div class="header">
      <h1>📚 جدول تقدم المواد</h1>
      <p>تابع تقدمك في كل مادة</p>
     </div>
     <div class="cards-grid" id="cardsGrid"></div>

    </div><!-- Login Modal -->
    <div class="login-modal" id="loginModal">
     <div class="login-box">
      <h2>🔐 تسجيل دخول</h2><input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
      <div class="login-buttons"><button class="login-btn login-btn-submit" id="loginSubmitBtn">دخول</button> <button class="login-btn login-btn-cancel" id="loginCancelBtn">إغلاق</button>

      <div class="login-error" id="loginError">
       كلمة مرور خاطئة!
      </div>
     </div>
    </div><!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
     <div class="admin-modal">
      <h2>⚙️ لوحة التحكم</h2><!-- Add Subject Form -->
      <div style="margin-bottom: 30px; padding-bottom: 30px; border-bottom: 2px solid #e0e0e0;">
       <h3 style="color: #667eea; margin-bottom: 15px; font-size: 1.2rem;">إضافة مادة جديدة</h3>
       <div class="form-group"><label>اسم المادة</label> <input type="text" id="subjectName" placeholder="مثال: القانون الدستوري">
       </div>
       <div class="form-group"><label>اليوم</label> <select id="subjectDay"> <option value="">اختر اليوم</option> <option value="الأحد">الأحد</option> <option value="الإثنين">الإثنين</option> <option value="الثلاثاء">الثلاثاء</option> <option value="الأربعاء">الأربعاء</option> <option value="الخميس">الخميس</option> <option value="الجمعة">الجمعة</option> <option value="السبت">السبت</option> </select>
       </div>

       </div>

       </div>
       <div class="form-group"><label>الصفحات المكتملة</label> <input type="number" id="completedPages" placeholder="مثال: 25">
       </div>
       <div class="form-group"><label>رابط الكتاب (اختياري)</label> <input type="url" id="bookUrl" placeholder="مثال: https://example.com/book.pdf">
       </div>

        <button class="btn btn-secondary" id="logoutBtn">تسجيل الخروج</button><!-- Subjects List -->

       <h3 style="color: #667eea; margin-bottom: 15px; font-size: 1.2rem;">المواد المضافة</h3>
       <div class="subjects-list" id="subjectsList"></div>
      </div>
     </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAjpqfDdoxYs8rRBw4UKOrvtMoqBDB0Z_s",
    authDomain: "hoba-tech.firebaseapp.com",
    databaseURL: "https://hoba-tech-default-rtdb.firebaseio.com",
    projectId: "hoba-tech",
    storageBucket: "hoba-tech.appspot.com",
    messagingSenderId: "465948708700",
    appId: "1:465948708700:web:dac008d1cb9f8caa50fb99"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allSubjects = [];
let editingId = null;
let isAuthenticated = false;
const ADMIN_PASSWORD = "admin123hoba";

// عناصر HTML
const adminPanel = document.getElementById('adminPanel');
const loginModal = document.getElementById('loginModal');
const passwordInput = document.getElementById('passwordInput');
const loginError = document.getElementById('loginError');
const addBtn = document.getElementById('addBtn');
const closeBtn = document.getElementById('closeBtn');
const logoutBtn = document.getElementById('logoutBtn');

function fetchSubjects() {
    db.ref('subjects').on('value', snapshot => {
        const data = snapshot.val() || {};
        allSubjects = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        renderCards();
        renderSubjectsList();
    });
}

function saveSubject(subject) {
    if(editingId) {
        db.ref('subjects/' + editingId).set(subject);
        editingId = null;
    } else {
        const newRef = db.ref('subjects').push();
        newRef.set(subject);
    }
}

function deleteSubjectFromDB(id) {
    db.ref('subjects/' + id).remove();
}

function renderCards() {
    const cardsGrid = document.getElementById('cardsGrid');
    const emptyState = document.getElementById('emptyState');
    if(allSubjects.length === 0) {
        cardsGrid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    emptyState.style.display = 'none';
            cardsGrid.innerHTML = allSubjects.map((subject, index) => {
                const progress = (parseInt(subject.completed_pages) / parseInt(subject.total_pages)) * 100;
                return `
                    <div class="subject-card" style="animation-delay: ${index * 0.1}s">
                        <div class="card-header">
                            <div class="subject-name">${subject.subject_name}</div>
                            ${isAuthenticated ? `<button class="edit-btn" onclick="editSubject('${subject.id}')">✏️</button>` : ''}
                        </div>
                        <div class="card-info">
                            <div class="info-row">
                                <span class="info-label">📅 اليوم:</span>
                                <span class="info-value">${subject.day}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">👨‍🏫 الدكتور:</span>
                                <span class="info-value">${subject.professor_name}</span>
                            </div>
                        </div>
                        <div class="progress-section">
                            <div class="progress-label">
                                <span>التقدم</span>
                                <span class="progress-text">${Math.round(progress)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="progress-label" style="margin-top: 8px; font-size: 0.85rem;">
                                <span>${subject.completed_pages} / ${subject.total_pages} صفحة</span>
                            </div>
                        </div>
                        ${subject.book_url ? `<div style="margin-top: 15px;"><a href="${subject.book_url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="display: inline-block; text-decoration: none; width: 100%; text-align: center;">📖 تحميل الكتاب</a></div>` : ''}
                    </div>
                `;
            }).join('');
        }
function renderSubjectsList() {
    const list = document.getElementById('subjectsList');
    if(allSubjects.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">لا توجد مواد بعد</div>';
        return;
    }
    list.innerHTML = allSubjects.map(s => `
    <div class="subject-item">
        <div class="subject-item-info">
            <div class="subject-item-name">${s.subject_name}</div>
            <div class="subject-item-details">${s.day} • ${s.professor_name}</div>
        </div>
        <div class="subject-item-actions">
            <button class="btn-small" onclick="editSubject('${s.id}')">تعديل</button>
            <button class="btn-small btn-delete" onclick="deleteSubject('${s.id}')">حذف</button>
        </div>
    </div>`).join('');
}

// تسجيل الدخول Triple Click
let clickCount = 0, clickTimer = null;
const header = document.querySelector('.header h1');
header.addEventListener('click', e => {
    e.stopPropagation();
    clickCount++;
    if(clickTimer) clearTimeout(clickTimer);
    if(clickCount === 3){
        loginModal.classList.add('active');
        passwordInput.focus();
        clickCount = 0;
    }
    clickTimer = setTimeout(()=>{clickCount=0;},400);
});

function attemptLogin(){
    if(passwordInput.value.trim() === ADMIN_PASSWORD){
        isAuthenticated = true;
        loginModal.classList.remove('active');
        loginError.classList.remove('show');
        passwordInput.value = '';
        adminPanel.classList.add('active');
        renderCards();
        renderSubjectsList();
    } else {
        loginError.classList.add('show');
        passwordInput.value = '';
    }
}

document.getElementById('loginSubmitBtn').addEventListener('click', attemptLogin);
document.getElementById('loginCancelBtn').addEventListener('click', ()=>{
    loginModal.classList.remove('active');
    loginError.classList.remove('show');
    passwordInput.value = '';
    clickCount=0;
});
passwordInput.addEventListener('keypress', e => { if(e.key==='Enter') attemptLogin(); });

// إدارة لوحة Admin
closeBtn.addEventListener('click', ()=>{ adminPanel.classList.remove('active'); clearForm(); });
adminPanel.addEventListener('click', e => { if(e.target===adminPanel){ adminPanel.classList.remove('active'); clearForm(); } });
logoutBtn.addEventListener('click', ()=>{
    isAuthenticated = false;
    adminPanel.classList.remove('active');
    renderCards();
    renderSubjectsList();
});

// إضافة/تعديل مادة
addBtn.addEventListener('click', ()=>{
    if(!isAuthenticated){ loginError.textContent='يجب تسجيل الدخول أولاً'; loginError.classList.add('show'); return; }
    const name = document.getElementById('subjectName').value.trim();
    const day = document.getElementById('subjectDay').value;
    const professor = document.getElementById('professorName').value.trim();
    const total = document.getElementById('totalPages').value;
    const completed = document.getElementById('completedPages').value;
    const bookUrl = document.getElementById('bookUrl').value.trim();
    if(!name||!day||!professor||!total||!completed){
        loginError.textContent='من فضلك ملء جميع الحقول المطلوبة';
        loginError.classList.add('show');
        return;
    }
    addBtn.innerHTML='<span class="spinner"></span>'; addBtn.disabled=true;
    const subject = {subject_name:name, day:day, professor_name:professor, total_pages:total, completed_pages:completed, book_url:bookUrl};
    saveSubject(subject);
    addBtn.innerHTML='إضافة ✨'; addBtn.disabled=false;
    clearForm();
});

// مسح النموذج
function clearForm(){
    ['subjectName','subjectDay','professorName','totalPages','completedPages','bookUrl'].forEach(id=>document.getElementById(id).value='');
    editingId=null;
    addBtn.innerHTML='إضافة ✨'; addBtn.disabled=false;
}

// تعديل مادة
window.editSubject = id =>{
    if(!isAuthenticated){ loginError.textContent='يجب تسجيل الدخول أولاً'; loginError.classList.add('show'); return; }
    const s = allSubjects.find(x=>x.id===id);
    if(s){
        document.getElementById('subjectName').value=s.subject_name;
        document.getElementById('subjectDay').value=s.day;
        document.getElementById('professorName').value=s.professor_name;
        document.getElementById('totalPages').value=s.total_pages;
        document.getElementById('completedPages').value=s.completed_pages;
        document.getElementById('bookUrl').value=s.book_url||'';
        editingId = id;
        addBtn.innerHTML='تحديث ✓';
        adminPanel.classList.add('active');
    }
};

// حذف مادة
window.deleteSubject = id =>{
    if(!isAuthenticated){ loginError.textContent='يجب تسجيل الدخول أولاً'; loginError.classList.add('show'); return; }
    if(confirm('هل تريد حذف هذه المادة؟')) deleteSubjectFromDB(id);
};

fetchSubjects();
</script>
</body>
</html>
