function normalizeLectureData(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) {
    return raw
      .filter(Boolean)
      .map((lec, i) => ({
        id: lec.id || `L${i + 1}`,
        ...lec,
        title: lec.title || `المحاضرة ${i + 1}`,
        description: lec.description || '',
        videoUrl: lec.videoUrl || '',
        audioUrl: lec.audioUrl || '',
        pdfUrl: lec.pdfUrl || '',
        pdfName: lec.pdfName || 'مذكرة.pdf',
        notes: lec.notes || '',
        updatedAt: Number(lec.updatedAt) || 0,
        quiz: Array.isArray(lec.quiz) ? lec.quiz : Object.values(lec.quiz || {})
      }));
  }
  return Object.keys(raw).map((key) => {
    const lec = raw[key] || {};
    return {
      id: key,
      ...lec,
      title: lec.title || key,
      description: lec.description || '',
      videoUrl: lec.videoUrl || '',
      audioUrl: lec.audioUrl || '',
      pdfUrl: lec.pdfUrl || '',
      pdfName: lec.pdfName || 'مذكرة.pdf',
      notes: lec.notes || '',
      updatedAt: Number(lec.updatedAt) || 0,
      quiz: Array.isArray(lec.quiz) ? lec.quiz : Object.values(lec.quiz || {})
    };
  });
}

function stripUndefinedDeep(value) {
  if (Array.isArray(value)) {
    return value.map(stripUndefinedDeep);
  }
  if (value && typeof value === 'object') {
    return Object.entries(value).reduce((acc, [key, entryValue]) => {
      if (entryValue === undefined) return acc;
      acc[key] = stripUndefinedDeep(entryValue);
      return acc;
    }, {});
  }
  return value;
}

function serializeLectureData(list) {
  return (list || []).reduce((acc, lecture, index) => {
    const id = lecture?.id || `L${index + 1}`;
    acc[id] = stripUndefinedDeep({
      ...lecture,
      id,
      title: lecture?.title || `المحاضرة ${index + 1}`,
      description: lecture?.description || '',
      videoUrl: lecture?.videoUrl || '',
      audioUrl: lecture?.audioUrl || '',
      pdfUrl: lecture?.pdfUrl || '',
      pdfName: lecture?.pdfName || 'مذكرة.pdf',
      notes: lecture?.notes || '',
      updatedAt: Number(lecture?.updatedAt) || Date.now(),
      quiz: Array.isArray(lecture?.quiz) ? lecture.quiz : Object.values(lecture?.quiz || {})
    });
    return acc;
  }, {});
}

function mergeLectureCollections(remoteLectures = [], localLectures = []) {
  const mergedMap = new Map();

  [...remoteLectures, ...localLectures].forEach((lecture, index) => {
    if(!lecture) return;
    const id = lecture.id || `L${index + 1}`;
    const current = mergedMap.get(id);
    if(!current) {
      mergedMap.set(id, { ...lecture, id });
      return;
    }

    const currentUpdated = Number(current.updatedAt) || 0;
    const nextUpdated = Number(lecture.updatedAt) || 0;
    const preferNext = nextUpdated >= currentUpdated;

    mergedMap.set(id, {
      ...current,
      ...(preferNext ? lecture : current),
      id,
      title: (preferNext ? lecture.title : current.title) || current.title || lecture.title || '',
      description: (preferNext ? lecture.description : current.description) || current.description || lecture.description || '',
      videoUrl: (preferNext ? lecture.videoUrl : current.videoUrl) || current.videoUrl || lecture.videoUrl || '',
      audioUrl: (preferNext ? lecture.audioUrl : current.audioUrl) || current.audioUrl || lecture.audioUrl || '',
      pdfUrl: (preferNext ? lecture.pdfUrl : current.pdfUrl) || current.pdfUrl || lecture.pdfUrl || '',
      pdfName: (preferNext ? lecture.pdfName : current.pdfName) || current.pdfName || lecture.pdfName || 'مذكرة.pdf',
      notes: (preferNext ? lecture.notes : current.notes) || current.notes || lecture.notes || '',
      updatedAt: Math.max(currentUpdated, nextUpdated),
      quiz: Array.isArray((preferNext ? lecture.quiz : current.quiz))
        ? (preferNext ? lecture.quiz : current.quiz)
        : Array.isArray(current.quiz) ? current.quiz : Array.isArray(lecture.quiz) ? lecture.quiz : []
    });
  });

  return Array.from(mergedMap.values());
}

function normalizeWordLevels(raw) {
  const source = Array.isArray(raw)
    ? raw
    : raw && typeof raw === 'object'
      ? Object.values(raw)
      : [];

  return source
    .filter(Boolean)
    .map((level, idx) => ({
      id: Number(level.id) || idx + 1,
      sortOrder: Number(level.sortOrder) || idx + 1,
      title: level.title || `المستوى ${idx + 1}`,
      subtitle: level.subtitle || 'قريباً...',
      unlocked: idx === 0 ? true : !!level.unlocked,
      updatedAt: Number(level.updatedAt) || 0,
      words: Array.isArray(level.words) && level.words.length > 0
        ? level.words.map((word) => ({
            fr: word?.fr || '',
            ar: word?.ar || '',
            example: word?.example || ''
          }))
        : [{ fr: '', ar: '', example: '' }]
    }));
}

function serializeWordLevels(levels) {
  return (levels || []).reduce((acc, level, index) => {
    const id = Number(level?.id) || index + 1;
    acc[`level_${id}`] = {
      ...level,
      id,
      sortOrder: Number(level?.sortOrder) || index + 1,
      updatedAt: Number(level?.updatedAt) || Date.now(),
      words: Array.isArray(level?.words) ? level.words : []
    };
    return acc;
  }, {});
}

function mergeWordLevels(remoteLevels = [], localLevels = []) {
  const mergedMap = new Map();
  [...remoteLevels, ...localLevels].forEach((level, index) => {
    if(!level) return;
    const id = Number(level.id) || index + 1;
    const current = mergedMap.get(id);
    if(!current) {
      mergedMap.set(id, { ...level, id });
      return;
    }
    const currentUpdated = Number(current.updatedAt) || 0;
    const nextUpdated = Number(level.updatedAt) || 0;
    const preferNext = nextUpdated >= currentUpdated;
    mergedMap.set(id, {
      ...current,
      ...(preferNext ? level : current),
      id,
      sortOrder: Number((preferNext ? level.sortOrder : current.sortOrder)) || Number(current.sortOrder) || Number(level.sortOrder) || id,
      title: (preferNext ? level.title : current.title) || current.title || level.title || `المستوى ${id}`,
      subtitle: (preferNext ? level.subtitle : current.subtitle) || current.subtitle || level.subtitle || 'قريباً...',
      unlocked: preferNext ? !!level.unlocked : !!current.unlocked,
      updatedAt: Math.max(currentUpdated, nextUpdated),
      words: Array.isArray(preferNext ? level.words : current.words)
        ? (preferNext ? level.words : current.words)
        : Array.isArray(current.words) ? current.words : Array.isArray(level.words) ? level.words : [{ fr:'', ar:'', example:'' }]
    });
  });
  return Array.from(mergedMap.values()).sort((a,b)=>(Number(a.sortOrder)||0)-(Number(b.sortOrder)||0));
}

function normalizeWordLevelOrder() {
  WORD_LEVELS = (WORD_LEVELS || []).map((level, index) => ({
    ...level,
    sortOrder: index + 1,
    unlocked: index === 0 ? true : !!level.unlocked,
    updatedAt: Date.now()
  }));
}

function calculatePointsFromPercent(percent) {
  const safePercent = Math.max(0, Number(percent) || 0);
  return Math.round((safePercent / 100) * 25);
}

function speak(text, lang='fr-FR') {
  if('speechSynthesis' in window) {
    const cleanText = String(text || '').replace(/\s+/g, ' ').trim();
    if(!cleanText) {
      showToast('لا يوجد نص لتشغيله', 'error');
      return;
    }
    const detectedLang = /[\u0600-\u06FF]/.test(cleanText) ? 'ar-SA' : lang;
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = detectedLang; u.rate=.85; u.pitch=1;
    const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
    const voice = voices.find(v => (v.lang || '').toLowerCase().startsWith(detectedLang.toLowerCase().slice(0, 2)));
    if(voice) u.voice = voice;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } else {
    showToast('المتصفح لا يدعم تشغيل الصوت', 'error');
  }
}

    console.error('Error saving word levels:', err);
    const isPermissionIssue = `${err?.code || ''}`.includes('permission');
    showToast(isPermissionIssue ? 'تم الحفظ محلياً فقط. صلاحيات Firebase تمنع الكتابة.' : 'تم الحفظ محلياً لكن تعذر الرفع على Firebase', 'error');
    return { ok: true, remote: false, error: err };
  }
}

<input class="inp" type="text" id="email-in" placeholder="الكود"/>        <input class="inp" type="password" id="pass-in" placeholder="كلمة السر" autocomplete="current-password"/>
        <div id="login-err" style="color:#ef4444;font-size:.85rem;margin-bottom:12px;text-align:center;min-height:20px;"></div>

          جميع الحقوق محفوظة لمنصة هوبا تيك
        </div>
      </div>
    </div>
  </div>`;
}async function loginWithCode() {
  const code = document.getElementById("email-in").value.trim();
  const pass = document.getElementById("pass-in").value;

  if (!code || !pass) {
    document.getElementById("login-err").innerText = "اكتب الكود والباسورد";
    return;
  }

  try {
    const snapshot = await get(ref(window._rtdb, 'codes/' + code));
    if (snapshot.exists()) {
      const user = snapshot.val();

      if (user.pass !== pass) {
        document.getElementById("login-err").innerText = "الباسورد غلط ❌";
        return;
      }

      // ✅ نجاح
      loginSuccess({
  code: user.userCode,
  name: user.name,
  role: user.role || "student",
  data: user
});

    } else {
      document.getElementById("login-err").innerText = "الكود غير موجود ❌";
    }

  } catch (err) {
    console.error(err);
    document.getElementById("login-err").innerText = "حصل خطأ ❌";
  }
}async function loginSuccess(user) {
  currentUser = user;
  localStorage.setItem('currentUser', JSON.stringify(user));

  await loadCustomDictionary();
  await loadLectures();
  await loadWordLevels();
  await loadSiteConfig();
  await loadUserProgressFromFirebase(user.code);
  subscribeLectures();
  subscribeWordLevels();
  userProgress = JSON.parse(localStorage.getItem('userProgress_' + user.code) || '{}');
  userLevelProgress = JSON.parse(localStorage.getItem('userLevelProgress_' + user.code) || '{}');

  showWelcomeCard(user.name); // 🔥 دي بس
}

function renderLectureDetail(lectureId) {
  const lec = LECTURES.find(l => l.id === lectureId);
  if(!lec) return '';

  const prog = userProgress[lec.id] || {};
  const isDone = prog.passed;
  const isQuizUnlocked = prog.quizPassed;
  const bestScore = prog.quizScore || 0;
  const bestPoints = prog.quizPoints ?? calculatePointsFromPercent(bestScore);
  const attempts = prog.quizAttempts || 0;

  function convertGoogleDriveLink(url) {
    if(!url) return null;
    const trimmed = url.trim();
    const fileIdMatch =
      trimmed.match(/\/file\/d\/([-\w]{20,})/i) ||
      trimmed.match(/[?&]id=([-\w]{20,})/i) ||
      trimmed.match(/\/uc\?.*?[?&]id=([-\w]{20,})/i);
    if(!fileIdMatch?.[1]) return null;
    const fileId = fileIdMatch[1];
    return {
      fileId,
      preview: `https://drive.google.com/file/d/${fileId}/preview`,
      embed: `https://drive.google.com/file/d/${fileId}/preview?usp=drivesdk`,
      stream: `https://drive.google.com/uc?export=view&id=${fileId}`,
      download: `https://drive.google.com/uc?export=download&id=${fileId}`,
      raw: trimmed
    };
  }

  function getYouTubeEmbed(url) {
    if(!url) return null;
    const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?/]+)/i);
    if(!match) return null;
    const id = match[1];
    return {
      preview: `https://www.youtube.com/embed/${id}`,
      download: url,
      raw: url
    };
  }

  function getMediaEmbed(url, type = 'file') {
    if(!url) return null;
    const trimmed = url.trim();
    const drive = convertGoogleDriveLink(trimmed);
    if(drive) return { ...drive, kind: 'drive' };

    if(type === 'video') {
      const youtube = getYouTubeEmbed(trimmed);
      if(youtube) return { ...youtube, kind: 'youtube' };
      if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(trimmed)) {
        return { raw: trimmed, preview: trimmed, download: trimmed, kind: 'direct-video' };
      }
    }

    if(type === 'audio') {
      if(/\.(mp3|wav|ogg|m4a)(\?|#|$)/i.test(trimmed)) {
        return { raw: trimmed, preview: trimmed, download: trimmed, kind: 'direct-audio' };
      }
    }

    if(type === 'pdf' && /\.pdf(\?|#|$)/i.test(trimmed)) {
      return { raw: trimmed, preview: trimmed, download: trimmed, kind: 'direct-pdf' };
    }

    return { raw: trimmed, preview: trimmed, download: trimmed, kind: 'external' };

  const video = getMediaEmbed(lec.videoUrl, 'video');

    ${video ? `<div class="lecture-panel">

      ${video.kind === 'direct-video'

        : video.kind === 'external'

        </div>`
          : `<div class="video-wrap" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-bottom:0;max-height:none;">

      </div>`}
    </div>` : `<div class="lecture-panel" style="text-align:center;color:rgba(255,255,255,.5);">لا يوجد فيديو لهذه المحاضرة حالياً</div>`}

    <div class="lecture-panel">

        ${(lec.notes || 'سيتم إضافة الشرح المكتوب قريباً').replace(/\n/g,'<br>')}
      </div>
      ${lec.notes ? `<div style="margin-top:14px;display:flex;justify-content:flex-end;">

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="stat-pill"><i data-lucide="file-badge" style="width:15px;height:15px;"></i>${lec.pdfName || 'لا يوجد ملف PDF'}</div>
        ${pdf
          ? `${pdf.kind === 'external'
              ? '<div style="color:rgba(255,255,255,.55);font-size:.85rem;">هذا الرابط لا يدعم المعاينة داخل الصفحة، لكن يمكنك فتحه مباشرة.</div>'

                : `<iframe src="${audio.preview}" width="100%" height="100" class="rounded-xl border-0" allowfullscreen loading="lazy"></iframe>`}
          <a href="${audio.download}" target="_blank" class="pdf-btn" style="justify-content:center;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.26);color:#4ade80;">فتح الملف الصوتي</a>`
          : '<div style="color:rgba(255,255,255,.46);font-size:.85rem;">لا يوجد شرح صوتي مرفق</div>'}

}function retakeLectureQuiz(lectureId) {

function startLectureQuiz(lecId) {

  </div>
  <div style="color:rgba(255,255,255,.55);margin-bottom:18px;">النجاح من 75%، وأعلى نتيجة فقط هي التي يتم حفظها.</div>`;
  lec.quiz.forEach((q,qi)=>{

      <div style="font-weight:700;margin-bottom:10px;color:#fff;">${qi+1}. ${q.q}</div>
      <div>
        ${q.opts.map((opt,oi)=>`
        <button class="quiz-option" id="qopt-${lecId}-${qi}-${oi}" onclick="selectQuizAnswer('${lecId}',${qi},${oi},${q.ans})">
          ${opt}
        </button>`).join('')}
      </div>
    </div>`;
  });
  quizHTML += `<div id="quiz-feedback-${lecId}" style="display:none;padding:14px;border-radius:10px;margin-top:12px;font-weight:700;text-align:center;"></div>
    <button onclick="submitQuiz('${lecId}')" id="submit-quiz-${lecId}"
      style="width:100%;padding:12px;background:linear-gradient(135deg,#ff6b35,#f7c59f);border:none;border-radius:10px;color:#0f0e17;font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:8px;">
      تسليم الاختبار
    </button>`;
  const modal = document.getElementById('quiz-modal');
  const content = document.getElementById('quiz-modal-content');

}

function renderPassedQuizBanner(lecId) {

  return `<div style="
    padding:14px;
    border-radius:10px;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.3);
    color:#22c55e;
    font-weight:700;
    text-align:center;
    margin-bottom:12px;
  ">

    <br>
    🎯 تقدر دلوقتي تنهي المحاضرة
  </div>`;
}

let lectureQuizAnswers = {};

function selectQuizAnswer(lecId, qi, oi, correct) {
  if(!lectureQuizAnswers[lecId]) lectureQuizAnswers[lecId]={};
  const allOpts = document.querySelectorAll(`[id^="qopt-${lecId}-${qi}-"]`);
  allOpts.forEach(el=>{
    el.classList.remove('correct','wrong','selected');
    el.style.borderColor='';
  });
  const selectedEl = document.getElementById(`qopt-${lecId}-${qi}-${oi}`);
  if(selectedEl) selectedEl.classList.add('selected');
  lectureQuizAnswers[lecId][qi] = oi;
}

function submitQuiz(lecId) {
  const lec = LECTURES.find(l=>l.id===lecId);
  if(!lec) return;
  const answers = lectureQuizAnswers[lecId]||{};
  let correct = 0;
  lec.quiz.forEach((q,qi)=>{
    const chosen = answers[qi];
    const optEl = document.getElementById(`qopt-${lecId}-${qi}-${chosen}`);
    const correctEl = document.getElementById(`qopt-${lecId}-${qi}-${q.ans}`);
    if(chosen!==undefined) {
      if(chosen===q.ans) { correct++; if(optEl) optEl.classList.add('correct'); }
      else { if(optEl) optEl.classList.add('wrong'); if(correctEl) correctEl.classList.add('correct'); }
    } else {
      if(correctEl) correctEl.classList.add('correct');
    }
  });
  const total = lec.quiz.length;
  const score = correct * (25 / total);
  const pct = Math.round((correct/total)*100);
  const passed = pct>=75;
  const previous = userProgress[lecId] || {};
  const previousBestScore = previous.quizScore || 0;
  const previousBestPoints = previous.quizPoints ?? calculatePointsFromPercent(previousBestScore);
  const bestScore = Math.max(previousBestScore, pct);
  const bestPoints = bestScore === pct ? Math.round(score) : previousBestPoints;
  const improved = pct > previousBestScore;

  document.querySelectorAll(`[id^="qopt-${lecId}-"]`).forEach(el=>el.disabled=true);
  const submitBtn = document.getElementById(`submit-quiz-${lecId}`);
  if(submitBtn) submitBtn.disabled=true;

  const fb = document.getElementById(`quiz-feedback-${lecId}`);
  if(fb) {
    fb.style.display='block';
    fb.style.background = passed?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)';
    fb.style.border = passed?'1px solid rgba(34,197,94,.3)':'1px solid rgba(239,68,68,.3)';
    fb.style.color = passed?'#22c55e':'#ef4444';
    fb.innerHTML = passed
      ? (improved
        ? `أحسنت! حققت ${pct}% وتم تحديث أفضل نتيجة لك.`
        : `نجحت بنسبة ${pct}%، وأفضل نتيجة محفوظة لك ما زالت ${bestScore}%.`)
      : `حصلت على ${pct}% وتحتاج 75% للنجاح. يمكنك إعادة الاختبار فوراً.`;
  }

  userProgress[lecId] = {
    ...previous,
    quizPassed: previous.quizPassed || passed,
    quizScore: bestScore,
    quizPoints: bestPoints,
    lastQuizScore: pct,
    lastQuizPoints: Math.round(score),
    quizAttempts: (previous.quizAttempts || 0) + 1
  };
  saveProgress();
  syncCurrentUserProgress();

  if(passed) {
    if(submitBtn) submitBtn.style.display = 'none';
    const quizSection = document.getElementById(`quiz-section-${lecId}`);
    if(quizSection && !document.getElementById(`finish-btn-${lecId}`) && !previous.passed){
      quizSection.innerHTML += `
        <button onclick="finishLecture('${lecId}')" id="finish-btn-${lecId}"
          style="width:100%;padding:12px;margin-top:12px;
          background:linear-gradient(135deg,#22c55e,#16a34a);
          border:none;border-radius:10px;color:#fff;
          font-weight:700;cursor:pointer;">
          إنهاء المحاضرة
        </button>
      `;
    }
  } else {
    if(submitBtn) {
      submitBtn.textContent = 'إعادة الاختبار';
      submitBtn.disabled=false;
      submitBtn.onclick = ()=>{
        lectureQuizAnswers[lecId]={};
        startLectureQuiz(lecId);
        lucide.createIcons();
      };
    }
  }
}

function finishLecture(lecId) {
  const prog = userProgress[lecId]||{};
  if(!prog.quizPassed) return;
  userProgress[lecId] = {...prog, passed:true, finishedAt: Date.now()};
  saveProgress();
  syncCurrentUserProgress();
  renderPage('curriculum');
}
function toggleLecture(lecId) {
  const body = document.getElementById(`lec-body-${lecId}`);
  const chev = document.getElementById(`chev-${lecId}`);
  if(!body) return;
  const isOpen = body.classList.contains('open');
  if(isOpen) {
    body.classList.remove('open');
    if(chev) chev.style.transform='';
  } else {
    // إغلاق الكل
    document.querySelectorAll('.lecture-body').forEach(b=>b.classList.remove('open'));
    document.querySelectorAll('[id^="chev-"]').forEach(c=>c.style.transform='');
    body.classList.add('open');
    if(chev) chev.style.transform='rotate(180deg)';
    lucide.createIcons();
  }
}

// ===================== مستويات الكلمات =====================

  // تحديث حالة الفتح بناءً على التقدم
  WORD_LEVELS.forEach((lv,i)=>{

  });

  let html = `<div style="animation:slideUp .5s ease;">
  <button onclick="navigate('home')" style="padding:10px 18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-family:'Cairo',sans-serif;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:20px;">
    <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>العودة للرئيسية

  <div class="section-title"><i data-lucide="layers"></i>مستويات الكلمات (${totalLevels} مستوى)</div>
  <p style="color:rgba(255,255,255,.4);margin-bottom:24px;font-size:.9rem;">تحتاج إلى 90% للانتقال للمستوى التالي. كل مستوى يحتوي على كلمات مع شرح وأمثلة وألعاب تفاعلية.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;">`;

  WORD_LEVELS.forEach(lv=>{
    const prog = userLevelProgress[lv.id]||{};
    const done = prog.passed;
    html += `
    <div class="level-card ${done?'done':lv.unlocked?'unlocked':'locked'}"
      onclick="${lv.unlocked||done?`openWordLevel(${lv.id})`:'showToast("🔒 أكمل المستوى السابق أولاً","error")'}">
      <div class="lock-icon">${done?'🏆':lv.unlocked?'🔓':'🔒'}</div>
      <div style="font-weight:700;font-size:.95rem;color:${done?'#22c55e':lv.unlocked?'#fff':'rgba(255,255,255,.3)'}">
        ${lv.title}
      </div>
      <div style="font-size:.75rem;color:rgba(255,255,255,.4);margin-top:4px;">${lv.subtitle}</div>
      ${done?`<div style="color:#22c55e;font-size:.75rem;margin-top:8px;font-weight:700;">✓ مكتمل - ${prog.score||0}%</div>`:''}
      ${lv.unlocked&&!done?`<span class="badge badge-orange" style="margin-top:8px;font-size:.7rem;">متاح</span>`:''}

function openWordLevel(id) {

  wordViewIndex = 0;
  renderPage('vocabulary');
  lucide.createIcons();
}

function getWordLevelMode(levelId) {
  const prog = userLevelProgress[levelId] || {};
  if (prog.quizActive) return 'quiz';
  return prog.wordMode || 'study';
}

function setWordMode(levelId, mode, reset = true) {
  if (mode !== 'speed') clearWordSpeedTimer();
  userLevelProgress[levelId] = {
    ...(userLevelProgress[levelId] || {}),
    quizActive: mode === 'quiz',
    wordMode: mode
  };
  if (reset) {
    wordGameState[levelId] = {
      ...(wordGameState[levelId] || {}),
      [mode]: null
    };
  }
  renderPage('vocabulary');
  lucide.createIcons();
}

let wordQuizState = {};
let wordGameState = {};

function startWordStudy(levelId) {
  setWordMode(levelId, 'study', false);
  wordViewIndex=0;
}

function startWordQuiz(levelId) {
  clearWordSpeedTimer();
  userLevelProgress[levelId] = {...(userLevelProgress[levelId]||{}), quizActive:true, wordMode:'quiz'};
  wordQuizState[levelId]={answers:{},submitted:false,qi:0};
  renderPage('vocabulary');
  lucide.createIcons();
}

function renderWordQuiz(levelId) {
  const lv = WORD_LEVELS.find(l=>l.id===levelId);
  if(!lv) return '';
  const state = wordQuizState[levelId]||{answers:{},submitted:false,qi:0};
  const prog = userLevelProgress[levelId]||{};

  if(prog.passed && !state.submitted) {
    return `<div class="card" style="text-align:center;border-color:rgba(34,197,94,.4);padding:40px;">
      <div style="font-size:3rem;margin-bottom:12px;">🏆</div>
      <div style="font-size:1.5rem;font-weight:700;color:#22c55e;">اجتزت هذا المستوى!</div>
      <div style="color:rgba(255,255,255,.6);margin-top:8px;">نتيجتك: ${prog.score||0}%</div>
    </div>`;
  }

  // أسئلة الاختبار: عرض الكلمة الفرنسية، اختر المعنى العربي
  const questions = lv.words.map((w,i)=>{
    const wrongOpts = lv.words.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.ar);
    const opts = [...wrongOpts,w.ar].sort(()=>Math.random()-.5);
    return {fr:w.fr,ar:w.ar,opts,correct:opts.indexOf(w.ar)};
  });

  if(!wordQuizState[levelId]?.questions) {
    wordQuizState[levelId]={...wordQuizState[levelId]||{},questions,qi:0,answers:{},submitted:false};
  }

  const qs = wordQuizState[levelId].questions||questions;
  const qi = wordQuizState[levelId].qi||0;
  const q = qs[qi];

  return `<div class="card" style="max-width:500px;margin:0 auto;">
    <div style="text-align:center;color:rgba(255,255,255,.4);font-size:.85rem;margin-bottom:20px;">
      سؤال ${qi+1} من ${qs.length}
    </div>
    <div class="progress-bar" style="margin-bottom:24px;">
      <div class="progress-fill" style="width:${Math.round(((qi)/qs.length)*100)}%"></div>
    </div>
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:2.5rem;font-weight:900;color:#ff6b35;margin-bottom:8px;">${q.fr}</div>
      <button class="speak-btn" onclick="speak('${q.fr.replace(/'/g,"\\'")}','fr-FR')" style="margin:0 auto;">
        <i data-lucide="volume-2" style="width:14px;height:14px;"></i>سماع
      </button>
      <div style="color:rgba(255,255,255,.5);margin-top:8px;">ما معنى هذه الكلمة؟</div>
    </div>
    ${q.opts.map((opt,oi)=>`
    <button class="quiz-option" onclick="answerWordQuiz(${levelId},${qi},${oi},${q.correct})">
      ${opt}
    </button>`).join('')}
    <div id="word-quiz-feedback-${levelId}" style="display:none;padding:12px;border-radius:8px;text-align:center;font-weight:700;margin-top:10px;"></div>
  </div>`;
}

function answerWordQuiz(levelId,qi,chosen,correct) {
  const lv = WORD_LEVELS.find(l=>l.id===levelId);
  if(!lv) return;
  const state = wordQuizState[levelId];
  if(!state||state.answers[qi]!==undefined) return;
  state.answers[qi]=chosen;

  const isCorrect = chosen===correct;
  const fb = document.getElementById(`word-quiz-feedback-${levelId}`);
  if(fb) {
    fb.style.display='block';
    fb.style.background=isCorrect?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)';
    fb.style.border=isCorrect?'1px solid rgba(34,197,94,.3)':'1px solid rgba(239,68,68,.3)';
    fb.style.color=isCorrect?'#22c55e':'#ef4444';
    fb.textContent=isCorrect?'✅ صحيح! ممتاز!':'❌ خطأ! الإجابة الصحيحة: '+lv.words[qi].ar;
  }

  setTimeout(()=>{
    const qs = state.questions;
    if(qi<qs.length-1) {
      state.qi=qi+1;
      renderPage('vocabulary');
      lucide.createIcons();
    } else {
      // النتيجة النهائية
      const correct2 = Object.entries(state.answers).filter(([k,v])=>qs[+k].correct===v).length;
      const pct = Math.round((correct2/qs.length)*100);
      const passed = pct>=90;
      if(passed) {
        userLevelProgress[levelId]={passed:true,score:pct,quizActive:false};
        // فتح المستوى التالي
        const currentIndex = WORD_LEVELS.findIndex(l=>l.id===levelId);
        const next = currentIndex>=0 ? WORD_LEVELS[currentIndex + 1] : null;
        if(next) next.unlocked=true;
        saveWordLevels();
        saveProgress();
      } else {
        userLevelProgress[levelId]={...userLevelProgress[levelId],quizActive:false};
      }
      saveProgress();
      syncCurrentUserProgress();
      showWordQuizResult(levelId,pct,passed,correct2,qs.length);
    }
  },1200);
}

  const c = document.getElementById('page-content');
  if(!c) return;
  const lv = WORD_LEVELS.find(l=>l.id===levelId);

    <div style="font-size:1.8rem;font-weight:900;color:${passed?'#22c55e':'#ef4444'};margin-bottom:8px;">

    ${passed?'<div style="color:#22c55e;margin-bottom:20px;">تم فتح المستوى التالي! 🔓</div>':'<div style="color:#ef4444;margin-bottom:20px;">تحتاج 90% للنجاح. راجع الكلمات وحاول مجدداً.</div>'}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button onclick="startWordStudy(${levelId})" style="padding:12px 24px;background:rgba(255,107,53,.2);border:1px solid rgba(255,107,53,.4);border-radius:12px;color:#ff6b35;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;">
        مراجعة الكلمات
      </button>
      <button onclick="wordLevelActive=null;renderPage('vocabulary');lucide.createIcons();" style="padding:12px 24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;">
        ${passed?'المستوى التالي':'العودة'}
      </button>
    </div>
  </div></div>`;
  lucide.createIcons();
}

function shuffleWords(items) {
  return [...items].sort(() => Math.random() - 0.5);
}

function ensureGameBucket(levelId, mode) {
  wordGameState[levelId] = wordGameState[levelId] || {};
  return wordGameState[levelId][mode];
}

function setGameBucket(levelId, mode, value) {
  wordGameState[levelId] = wordGameState[levelId] || {};
  wordGameState[levelId][mode] = value;
  return wordGameState[levelId][mode];
}

function prepareWordQuestions(lv, type) {
  const pool = shuffleWords(lv.words).slice(0, Math.min(lv.words.length, 8));
  return pool.map((word, index) => {
    const distractors = shuffleWords(lv.words.filter((_, i) => lv.words[i] !== word)).slice(0, 3);
    if (type === 'match') {
      const opts = shuffleWords([word.fr, ...distractors.map(item => item.fr)]);
      return {
        prompt: word.ar,
        subtext: 'اختر الكلمة الفرنسية الصحيحة',
        answer: word.fr,
        options: opts
      };
    }
    if (type === 'scramble') {
      const letters = word.fr.split('');
      let scrambled = shuffleWords(letters).join('');
      if (scrambled.toLowerCase() === word.fr.toLowerCase()) {
        scrambled = shuffleWords(letters.reverse()).join('');
      }
      const opts = shuffleWords([word.fr, ...distractors.map(item => item.fr)]);
      return {
        prompt: scrambled,
        subtext: `المعنى: ${word.ar}`,
        answer: word.fr,
        options: opts
      };
    }
    const opts = shuffleWords([word.fr, ...distractors.map(item => item.fr)]);
    return {
      prompt: word.example,
      subtext: 'أي كلمة تناسب هذه الجملة؟',
      answer: word.fr,
      options: opts
    };
  });
}

function renderChoiceGame(levelId, mode, config) {
  const lv = WORD_LEVELS.find(l => l.id === levelId);
  if (!lv) return '';
  let state = ensureGameBucket(levelId, mode);
  if (!state) {
    state = setGameBucket(levelId, mode, {
      questions: prepareWordQuestions(lv, mode),
      index: 0,
      score: 0,
      answered: false,
      selected: null,
      finished: false
    });
  }

  if (state.finished) {
    const total = state.questions.length || 1;
    const pct = Math.round((state.score / total) * 100);
    return `<div class="card" style="max-width:560px;margin:0 auto;text-align:center;border-color:rgba(255,107,53,.3);">
      <div style="font-size:3rem;margin-bottom:12px;">${pct >= 70 ? '🎉' : '💪'}</div>
      <div style="font-size:1.6rem;font-weight:900;color:#fff;margin-bottom:10px;">${config.title}</div>
      <div style="font-size:2.6rem;font-weight:900;color:#ff6b35;">${pct}%</div>
      <div style="color:rgba(255,255,255,.6);margin:8px 0 20px;">${state.score} إجابة صحيحة من ${total}</div>
      <button onclick="restartWordGame(${levelId},'${mode}')" style="padding:12px 24px;background:linear-gradient(135deg,#ff6b35,#f7c59f);border:none;border-radius:12px;color:#0f0e17;font-family:'Cairo',sans-serif;font-weight:800;cursor:pointer;">
        إعادة اللعبة
      </button>
    </div>`;
  }

  const q = state.questions[state.index];
  return `<div class="card" style="max-width:620px;margin:0 auto;">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap;">
      <div style="font-size:.9rem;color:rgba(255,255,255,.5);">${config.title}</div>
      <div style="font-size:.88rem;color:#ff6b35;">السؤال ${state.index + 1} من ${state.questions.length}</div>
    </div>
    <div class="progress-bar" style="margin-bottom:20px;">
      <div class="progress-fill" style="width:${Math.round((state.index / state.questions.length) * 100)}%"></div>
    </div>
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:${mode==='scramble'?'2.4rem':'1.4rem'};font-weight:900;color:#fff;margin-bottom:10px;">${q.prompt}</div>
      <div style="color:rgba(255,255,255,.5);line-height:1.8;">${q.subtext}</div>
    </div>
    <div style="display:grid;gap:12px;">
      ${q.options.map((opt, oi) => `
        <button class="quiz-option" onclick="answerChoiceGame(${levelId},'${mode}',${oi})" ${state.answered ? 'disabled' : ''} style="${state.answered && state.selected===oi ? `border-color:${opt===q.answer ? 'rgba(34,197,94,.45)' : 'rgba(239,68,68,.45)'};background:${opt===q.answer ? 'rgba(34,197,94,.12)' : 'rgba(239,68,68,.12)'};` : ''}">
          ${opt}
        </button>
      `).join('')}
    </div>
    <div id="word-game-feedback-${mode}-${levelId}" style="display:${state.answered ? 'block' : 'none'};margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-weight:700;background:${state.selected !== null && q.options[state.selected] === q.answer ? 'rgba(34,197,94,.1)' : 'rgba(239,68,68,.1)'};border:1px solid ${state.selected !== null && q.options[state.selected] === q.answer ? 'rgba(34,197,94,.3)' : 'rgba(239,68,68,.3)'};color:${state.selected !== null && q.options[state.selected] === q.answer ? '#22c55e' : '#ef4444'};">
      ${state.selected !== null ? (q.options[state.selected] === q.answer ? '✅ إجابة ممتازة' : `❌ الصحيحة هي: ${q.answer}`) : ''}
    </div>
  </div>`;
}

function answerChoiceGame(levelId, mode, optionIndex) {
  const state = ensureGameBucket(levelId, mode);
  if (!state || state.answered || state.finished) return;
  const q = state.questions[state.index];
  state.selected = optionIndex;
  state.answered = true;
  if (q.options[optionIndex] === q.answer) state.score += 1;
  renderPage('vocabulary');
  lucide.createIcons();
  setTimeout(() => {
    const current = ensureGameBucket(levelId, mode);
    if (!current) return;
    current.answered = false;
    current.selected = null;
    current.index += 1;
    if (current.index >= current.questions.length) current.finished = true;
    renderPage('vocabulary');
    lucide.createIcons();
  }, 850);
}

function restartWordGame(levelId, mode) {
  if (mode === 'speed') clearWordSpeedTimer();
  setGameBucket(levelId, mode, null);
  setWordMode(levelId, mode, false);
}

function startWordSpeedTimer(levelId) {
  clearWordSpeedTimer();
  wordSpeedTimerLevel = levelId;
  wordSpeedTimer = setInterval(() => {
    const state = ensureGameBucket(levelId, 'speed');
    if (!state || state.finished) {
      clearWordSpeedTimer();
      return;
    }
    state.timeLeft -= 1;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      state.finished = true;
      clearWordSpeedTimer();
    }
    if (wordLevelActive === levelId && getWordLevelMode(levelId) === 'speed') {
      renderPage('vocabulary');
      lucide.createIcons();
    }
  }, 1000);
}

function clearWordSpeedTimer() {
  if (wordSpeedTimer) {
    clearInterval(wordSpeedTimer);
    wordSpeedTimer = null;
  }
  wordSpeedTimerLevel = null;
}

function renderWordSpeedGame(levelId) {
  const lv = WORD_LEVELS.find(l => l.id === levelId);
  if (!lv) return '';
  let state = ensureGameBucket(levelId, 'speed');
  if (!state) {
    state = setGameBucket(levelId, 'speed', {
      questions: prepareWordQuestions(lv, 'match'),
      index: 0,
      score: 0,
      timeLeft: 30,
      finished: false
    });

function renderWordMemoryGame(levelId) {
  const lv = WORD_LEVELS.find(l => l.id === levelId);
  if (!lv) return '';
  let state = ensureGameBucket(levelId, 'memory');
  if (!state) {
    const chosen = shuffleWords(lv.words).slice(0, Math.min(4, lv.words.length));
    const cards = shuffleWords(chosen.flatMap((word, idx) => ([
      { id: `${idx}-fr`, pairId: idx, text: word.fr, kind: 'fr', matched: false },
      { id: `${idx}-ar`, pairId: idx, text: word.ar, kind: 'ar', matched: false }
    ])));
    state = setGameBucket(levelId, 'memory', {
      cards,
      flipped: [],
      busy: false,
      moves: 0,
      finished: false
    });
  }

  if (state.finished) {
    return `<div class="card" style="max-width:620px;margin:0 auto;text-align:center;">
      <div style="font-size:3rem;margin-bottom:12px;">🃏</div>
      <div style="font-size:1.7rem;font-weight:900;color:#fff;">أنهيت لعبة الذاكرة</div>
      <div style="color:rgba(255,255,255,.6);margin:10px 0 22px;">عدد المحاولات: ${state.moves}</div>
      <button onclick="restartWordGame(${levelId},'memory')" style="padding:12px 24px;background:linear-gradient(135deg,#ff6b35,#f7c59f);border:none;border-radius:12px;color:#0f0e17;font-family:'Cairo',sans-serif;font-weight:800;cursor:pointer;">
        إعادة اللعبة
      </button>
    </div>`;
  }

  return `<div class="card" style="max-width:760px;margin:0 auto;">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap;">
      <div style="font-size:1rem;font-weight:800;color:#fff;">🃏 لعبة الذاكرة</div>
      <div style="color:#ff6b35;font-weight:800;">الحركات: ${state.moves}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;">
      ${state.cards.map((card, index) => {
        const isFlipped = card.matched || state.flipped.includes(index);
        return `
          <button onclick="flipMemoryCard(${levelId},${index})" ${state.busy || card.matched ? 'disabled' : ''} style="min-height:110px;border-radius:16px;border:1px solid ${card.matched ? 'rgba(34,197,94,.3)' : 'rgba(255,255,255,.12)'};background:${isFlipped ? (card.kind === 'fr' ? 'rgba(255,107,53,.16)' : 'rgba(34,197,94,.14)') : 'rgba(255,255,255,.05)'};color:#fff;padding:16px;font-family:'Cairo',sans-serif;font-size:${isFlipped ? '1rem' : '1.6rem'};font-weight:800;cursor:${state.busy || card.matched ? 'default' : 'pointer'};">
            ${isFlipped ? card.text : '؟'}
          </button>
        `;
      }).join('')}
    </div>
  </div>`;
}

function flipMemoryCard(levelId, cardIndex) {
  const state = ensureGameBucket(levelId, 'memory');
  if (!state || state.busy || state.flipped.includes(cardIndex) || state.cards[cardIndex]?.matched) return;
  state.flipped.push(cardIndex);
  if (state.flipped.length === 2) {
    state.busy = true;
    state.moves += 1;
    const [firstIdx, secondIdx] = state.flipped;
    const first = state.cards[firstIdx];
    const second = state.cards[secondIdx];
    if (first && second && first.pairId === second.pairId && first.kind !== second.kind) {
      first.matched = true;
      second.matched = true;
      state.flipped = [];
      state.busy = false;
      if (state.cards.every(card => card.matched)) state.finished = true;
      renderPage('vocabulary');
      lucide.createIcons();
      return;
    }
    renderPage('vocabulary');
    lucide.createIcons();
    setTimeout(() => {
      const current = ensureGameBucket(levelId, 'memory');
      if (!current) return;
      current.flipped = [];
      current.busy = false;
      renderPage('vocabulary');
      lucide.createIcons();
    }, 850);
    return;
  }
  renderPage('vocabulary');
  lucide.createIcons();
}

const frDict = {
  'مرحبا':'Bonjour','صباح الخير':'Bonjour','مساء الخير':'Bonsoir','شكراً':'Merci','شكرا':'Merci',
  'من فضلك':"S'il vous plaît",'نعم':'Oui','لا':'Non','اسمي':"Je m'appelle",
  'كيف حالك':'Comment allez-vous?','كيف حالك؟':'Comment allez-vous?',
  'بخير':'Très bien','مع السلامة':'Au revoir','آسف':'Pardon','عذراً':'Excusez-moi',
  'أحمر':'Rouge','أزرق':'Bleu','أخضر':'Vert','أصفر':'Jaune','أبيض':'Blanc','أسود':'Noir',
  'واحد':'Un','اثنان':'Deux','ثلاثة':'Trois','أربعة':'Quatre','خمسة':'Cinq',
  'ستة':'Six','سبعة':'Sept','ثمانية':'Huit','تسعة':'Neuf','عشرة':'Dix',
  'بيت':'Maison','كتاب':'Livre','ماء':'Eau','طعام':'Nourriture','سيارة':'Voiture',
  'أحبك':"Je t'aime",'أنا':'Je','أنت':'Tu','هو':'Il','هي':'Elle','نحن':'Nous',
  'جميل':'Beau','كبير':'Grand','صغير':'Petit','جديد':'Nouveau',
};
const arDict = Object.fromEntries(Object.entries(frDict).map(([k,v])=>[v.toLowerCase(),k]));

let transOutputText = '';

function normalizeArabicText(text) {
  return String(text || '')
    .trim()
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[ًٌٍَُِّْـ]/g, '')
    .replace(/\s+/g, ' ');
}

function normalizeFrenchText(text) {
  return String(text || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

function buildRuntimeTranslateDicts() {
  const dynamicFr = { ...frDict };
  (CUSTOM_TRANSLATE_ENTRIES || []).forEach(entry => {
    const ar = String(entry?.ar || '').trim();
    const fr = String(entry?.fr || '').trim();
    if(ar && fr) dynamicFr[ar] = fr;
  });
  (WORD_LEVELS || []).forEach(level => {
    (level?.words || []).forEach(word => {
      const ar = String(word?.ar || '').trim();
      const fr = String(word?.fr || '').trim();
      if(ar && fr) dynamicFr[ar] = fr;
    });
  });
  const normalizedFr = {};
  Object.entries(dynamicFr).forEach(([ar, fr]) => {
    normalizedFr[normalizeArabicText(ar)] = fr;
  });
  const dynamicAr = Object.fromEntries(Object.entries(dynamicFr).map(([ar, fr]) => [String(fr || '').toLowerCase(), ar]));
  const normalizedAr = {};
  Object.entries(dynamicAr).forEach(([fr, ar]) => {
    normalizedAr[normalizeFrenchText(fr)] = ar;
  });
  return { dynamicFr, dynamicAr, normalizedFr, normalizedAr };
}

function normalizeTranslateToken(token) {
  return String(token || '').trim().replace(/[؟،.!?,;:]/g, '');
}

function translateByDictionary(text, mode, dynamicFr, dynamicAr, normalizedFr, normalizedAr) {
  const cleanText = String(text || '').trim();
  if(!cleanText) return '';

  if(mode === 'ar2fr') {
    const normalizedSentence = normalizeArabicText(cleanText);
    if(dynamicFr[cleanText]) return dynamicFr[cleanText];
    if(normalizedFr[normalizedSentence]) return normalizedFr[normalizedSentence];
    return cleanText.split(/\s+/).map(token => {
      const normalized = normalizeTranslateToken(token);
      const normalizedArabic = normalizeArabicText(normalized);
      return dynamicFr[token] || dynamicFr[normalized] || normalizedFr[normalizedArabic] || token;
    }).join(' ');
  }

  const lowerText = cleanText.toLowerCase();
  const normalizedSentence = normalizeFrenchText(cleanText);
  if(dynamicAr[lowerText]) return dynamicAr[lowerText];
  if(normalizedAr[normalizedSentence]) return normalizedAr[normalizedSentence];
  return cleanText.split(/\s+/).map(token => {
    const lower = token.toLowerCase();
    const normalized = normalizeTranslateToken(lower);
    const normalizedFrench = normalizeFrenchText(normalized);
    return dynamicAr[lower] || dynamicAr[normalized] || normalizedAr[normalizedFrench] || token;
  }).join(' ');
}

function doTranslate() {
  const inp = document.getElementById('trans-input');
  const out = document.getElementById('trans-output');
  if(!inp||!out) return;
  const text = inp.value.trim();
  if(!text) { out.innerHTML='<span style="color:rgba(255,255,255,.2);">ستظهر الترجمة هنا...</span>'; transOutputText=''; return; }

  out.innerHTML = '<span style="color:rgba(255,255,255,.45);">جاري الترجمة...</span>';
  clearTimeout(translateDebounceTimer);
  translateDebounceTimer = setTimeout(async () => {
    const result = await translateTextSmart(text, translateMode);
    transOutputText = result;
    out.textContent = result;
  }, 350);
}

function translateTextValue(text, mode = translateMode) {
  const { dynamicFr, dynamicAr, normalizedFr, normalizedAr } = buildRuntimeTranslateDicts();
  return translateByDictionary(text, mode, dynamicFr, dynamicAr, normalizedFr, normalizedAr);
}

async function translateTextSmart(text, mode = translateMode) {
  const cleanText = String(text || '').trim();
  if(!cleanText) return '';

  const endpoint = String(siteConfig?.translate_endpoint || '').trim();
  if(endpoint) {
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: cleanText,
          mode,
          model: siteConfig?.translate_model || ''
        })
      });
      const payload = await response.json();
      if(response.ok && payload?.translation) {
        return String(payload.translation).trim();
      }
      console.error('AI translate endpoint error:', payload);
    } catch (err) {
      console.error('AI translate request failed:', err);
    }
  }

  return translateTextValue(cleanText, mode);
}

function openQuickTranslate() {
  const modal = document.getElementById('quick-translate-modal');
  const content = document.getElementById('quick-translate-content');
  if(!modal || !content) return;
  content.innerHTML = renderQuickTranslateModal();
  modal.style.display = 'flex';
  lucide.createIcons();
  setTimeout(() => document.getElementById('quick-trans-input')?.focus(), 30);
}

function closeQuickTranslate() {
  const modal = document.getElementById('quick-translate-modal');
  if(modal) modal.style.display = 'none';
}

function doQuickTranslate() {
  const input = document.getElementById('quick-trans-input');
  const output = document.getElementById('quick-trans-output');
  if(!input || !output) return;
  const text = input.value.trim();
  if(!text) {
    transOutputText = '';
    output.innerHTML = '<span style="color:rgba(255,255,255,.2);">ستظهر الترجمة هنا...</span>';
    return;
  }
  output.innerHTML = '<span style="color:rgba(255,255,255,.45);">جاري الترجمة...</span>';
  clearTimeout(quickTranslateDebounceTimer);
  quickTranslateDebounceTimer = setTimeout(async () => {
    const result = await translateTextSmart(text, translateMode);
    transOutputText = result;
    output.textContent = result;
  }, 350);
}

function setQuickTransMode(mode) {
  translateMode = mode;
  openQuickTranslate();
}

function swapQuickTranslate() {
  translateMode = translateMode==='ar2fr' ? 'fr2ar' : 'ar2fr';
  openQuickTranslate();
}

function clearQuickTranslate() {
  const input = document.getElementById('quick-trans-input');
  const output = document.getElementById('quick-trans-output');
  if(input) input.value = '';
  if(output) output.innerHTML = '<span style="color:rgba(255,255,255,.2);">ستظهر الترجمة هنا...</span>';
  transOutputText = '';
}

function speakQuickTranslateOutput() {
  speakOutput();
}

function copyQuickTranslateOutput() {
  copyOutput();
}

function makeEmptyQuestion() {
  return { q: '', opts: ['الخيار الأول', 'الخيار الثاني', 'الخيار الثالث', 'الخيار الرابع'], ans: 0 };
}

function makeEmptyWord() {
  return { fr: '', ar: '', example: '' };
}

function normalizeImportedWord(item, idx = 0) {
  return {
    fr: String(item?.fr || item?.word || item?.french || item?.term || '').trim(),
    ar: String(item?.ar || item?.meaning || item?.arabic || item?.translation || '').trim(),
    example: String(item?.example || item?.ex || item?.sentence || item?.usage || '').trim()
  };
}

function normalizeImportedQuestion(question, idx = 0) {
  const prompt = question?.q || question?.question || question?.text || `سؤال ${idx + 1}`;
  const rawOptions = Array.isArray(question?.opts)
    ? question.opts
    : Array.isArray(question?.options)
      ? question.options
      : Array.isArray(question?.choices)
        ? question.choices
        : [];
  const opts = [...rawOptions]
    .map((opt) => String(opt || '').trim())
    .filter(Boolean)
    .slice(0, 6);
  while(opts.length < 2) opts.push(`الخيار ${opts.length + 1}`);
  let ans = Number.isInteger(question?.ans) ? Number(question.ans) : Number(question?.answer);
  if(Number.isNaN(ans)) ans = 0;
  if(ans >= 1 && question?.answer && !Number.isInteger(question?.ans)) ans -= 1;
  ans = Math.max(0, Math.min(opts.length - 1, ans));
  return {
    q: String(prompt || `سؤال ${idx + 1}`),
    opts: opts.map((opt, optionIdx) => String(opt || `الخيار ${optionIdx + 1}`)),
    ans
  };
}

function normalizeQuestionShape(question, idx = 0) {
  return normalizeImportedQuestion(question, idx);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeJsText(value) {
  return JSON.stringify(String(value ?? '')).slice(1, -1);
}

function parseQuestionsJsonInput(rawText) {
  const text = String(rawText || '').trim();
  if(!text) throw new Error('أضف JSON أولاً');
  const parsed = JSON.parse(text);
  const questionsSource = Array.isArray(parsed)
    ? parsed
    : Array.isArray(parsed?.questions)
      ? parsed.questions
      : null;
  if(!questionsSource || questionsSource.length === 0) {
    throw new Error('صيغة JSON غير صحيحة. استخدم Array أو questions[]');
  }
  return questionsSource.map((question, idx) => normalizeImportedQuestion(question, idx));
}

function parseWordsJsonInput(rawText) {
  const text = String(rawText || '').trim();
  if(!text) throw new Error('أضف JSON أولاً');
  const parsed = JSON.parse(text);
  const wordsSource = Array.isArray(parsed)
    ? parsed
    : Array.isArray(parsed?.words)
      ? parsed.words
      : null;
  if(!wordsSource || wordsSource.length === 0) {
    throw new Error('صيغة JSON غير صحيحة. استخدم Array أو words[]');
  }
  const words = wordsSource.map((item, idx) => normalizeImportedWord(item, idx)).filter(word => word.fr || word.ar || word.example);
  if(!words.length) {
    throw new Error('ملف الكلمات لا يحتوي على بيانات صالحة');
  }
  return words;
}

function renderQuestionEditorBlock(question, idx, mode='new') {
  const prefix = mode === 'edit' ? 'edit' : 'new';
  const options = Array.isArray(question?.opts) && question.opts.length > 0
    ? question.opts
    : ['الخيار الأول', 'الخيار الثاني'];
  const addChoiceFn = mode === 'edit' ? `addChoiceToEditQuestion(${idx})` : `addChoiceToDraftQuestion(${idx})`;
  const removeChoiceFn = mode === 'edit' ? `removeChoiceFromEditQuestion(${idx})` : `removeChoiceFromDraftQuestion(${idx})`;
  return `
  <div style="background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.025));border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid rgba(34,197,94,.2);">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      <div style="font-size:.86rem;color:#22c55e;font-weight:700;">السؤال ${idx+1}</div>
      <button onclick="${mode === 'edit' ? `removeEditQuestion(${idx})` : `removeDraftQuestion(${idx})`}" style="padding:6px 10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.25);border-radius:8px;color:#ef4444;font-family:'Cairo',sans-serif;cursor:pointer;">حذف</button>
    </div>
    <div style="font-size:.74rem;color:rgba(255,255,255,.45);margin-bottom:8px;">نص السؤال</div>
    <input class="inp-dark" id="${prefix}-q-q${idx}" value="${escapeHtml(question.q || '')}" placeholder="نص السؤال"/>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 8px;">
      <div style="font-size:.78rem;color:rgba(255,255,255,.45);">الاختيارات:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="${addChoiceFn}" type="button" style="padding:6px 10px;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.28);border-radius:8px;color:#22c55e;font-family:'Cairo',sans-serif;cursor:pointer;">إضافة اختيار</button>
        <button onclick="${removeChoiceFn}" type="button" style="padding:6px 10px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.28);border-radius:8px;color:#f87171;font-family:'Cairo',sans-serif;cursor:pointer;">حذف اختيار</button>
      </div>
    </div>
    ${options.map((opt, j)=>`
      <div style="margin-bottom:8px;">
        <div style="font-size:.72rem;color:rgba(255,255,255,.34);margin-bottom:6px;">الخيار ${j+1}</div>
        <input class="inp-dark" id="${prefix}-q-o${idx}-${j}" value="${escapeHtml(opt || '')}" placeholder="اكتب الخيار ${j+1}"/>
      </div>
    `).join('')}
    <div style="font-size:.74rem;color:rgba(255,255,255,.45);margin:10px 0 6px;">الإجابة الصحيحة</div>
    <select class="inp-dark" id="${prefix}-q-ans${idx}">
      ${options.map((_, optionIdx)=>`<option value="${optionIdx}" ${Number(question.ans)===optionIdx?'selected':''}>الإجابة الصحيحة: الخيار ${optionIdx + 1}</option>`).join('')}
    </select>
  </div>`;
}

function renderDraftQuestions() {

  return `
  <div style="margin-bottom:12px;padding:12px 14px;border-radius:12px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#bbf7d0;font-size:.84rem;font-weight:700;">
    تم تجهيز ${adminDraftQuestions.length} سؤال للامتحان. لا تنس الضغط على "حفظ المحاضرة" لتسجيلها نهائياً.
  </div>

function renderEditQuestions() {

function refreshDraftQuestionsView() {
  const container = document.getElementById('draft-questions-container');
  if(container) {
    container.innerHTML = renderDraftQuestions();
    lucide.createIcons();
  } else {
    showAddLectureForm();
  }
}

function addDraftQuestion() {
  syncAdminLectureDraftFromForm();
  adminDraftQuestions.push(makeEmptyQuestion());
  refreshDraftQuestionsView();
}

function addChoiceToDraftQuestion(idx) {
  syncAdminLectureDraftFromForm();
  const question = adminDraftQuestions[idx];
  if(!question) return;
  question.opts = Array.isArray(question.opts) ? question.opts : ['الخيار الأول', 'الخيار الثاني'];
  if(question.opts.length >= 6) return;
  question.opts.push(`الخيار ${question.opts.length + 1}`);
  refreshDraftQuestionsView();
}

function removeChoiceFromDraftQuestion(idx) {
  syncAdminLectureDraftFromForm();
  const question = adminDraftQuestions[idx];
  if(!question || !Array.isArray(question.opts) || question.opts.length <= 2) return;
  question.opts.pop();
  question.ans = Math.min(Number(question.ans) || 0, question.opts.length - 1);
  refreshDraftQuestionsView();
}

function removeDraftQuestion(idx) {
  syncAdminLectureDraftFromForm();
  if(adminDraftQuestions.length <= 1) return;
  adminDraftQuestions.splice(idx, 1);
  refreshDraftQuestionsView();
}

function readQuestionsFile(file, onSuccess) {
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const questions = parseQuestionsJsonInput(reader.result);
      onSuccess(questions);
    } catch (err) {
      showToast(err?.message || 'ملف JSON غير صالح', 'error');
    }
  };
  reader.onerror = () => showToast('تعذر قراءة الملف', 'error');
  reader.readAsText(file, 'utf-8');
}

function handleDraftQuestionsFile(event) {
  const file = event?.target?.files?.[0];
  readQuestionsFile(file, (questions) => {
    syncAdminLectureDraftFromForm();
    adminDraftQuestions = questions;
    lastDraftQuestionsJson = JSON.stringify({ questions }, null, 2);
    const textarea = document.getElementById('new-questions-json');
    if(textarea) textarea.value = lastDraftQuestionsJson;
    refreshDraftQuestionsView();
    setTimeout(() => document.getElementById('new-q-q0')?.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
    showToast(`تم تجهيز ${questions.length} سؤال. اضغط حفظ المحاضرة للتسجيل النهائي`, 'success');
  });
  if(event?.target) event.target.value = '';
}

function rebuildWordRows(containerId, ids, words) {
  const list = document.getElementById(containerId);
  if(!list) return;
  list.innerHTML = words.map((word, wi) => `
    <div style="display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-bottom:8px;align-items:center;" id="${ids.row}${wi}">
      <input class="inp-dark" style="margin:0;" id="${ids.fr}${wi}" value="${escapeHtml(word.fr || '')}" placeholder="فرنسي"/>
      <input class="inp-dark" style="margin:0;" id="${ids.ar}${wi}" value="${escapeHtml(word.ar || '')}" placeholder="عربي"/>
      <input class="inp-dark" style="margin:0;" id="${ids.example}${wi}" value="${escapeHtml(word.example || '')}" placeholder="مثال"/>
      <button onclick="this.parentElement.remove()" style="background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#ef4444;padding:8px;cursor:pointer;">✕</button>
    </div>
  `).join('');
}

async function saveNewLecture() {
  const title = document.getElementById('new-lec-title').value.trim();
  if(!title){showToast('يرجى إدخال عنوان المحاضرة','error');return;}
  const quiz = adminDraftQuestions.map((_, i)=>(
    {
      q: document.getElementById(`new-q-q${i}`)?.value || `سؤال ${i+1}`,
      opts: (adminDraftQuestions[i]?.opts || []).map((__, j)=>document.getElementById(`new-q-o${i}-${j}`)?.value || `خيار ${j+1}`).filter(Boolean),
      ans: parseInt(document.getElementById(`new-q-ans${i}`)?.value || 0, 10)
    }
  ));
  const lec = {
    id:'L'+(Date.now()),
    title, description:document.getElementById('new-lec-desc').value,
    videoUrl:document.getElementById('new-lec-video').value,
    audioUrl:document.getElementById('new-lec-audio').value,
    pdfUrl:document.getElementById('new-lec-pdf-url').value,
    pdfName:document.getElementById('new-lec-pdf-name').value||'مذكرة.pdf',
    notes:document.getElementById('new-lec-notes').value,
    updatedAt: Date.now(),
    quiz
  };
  LECTURES.push(lec);
  const saved = await saveLectures();
  if(!saved?.ok) return;
  adminDraftQuestions = [];
  showToast(saved.remote ? '✅ تم إضافة المحاضرة' : 'تمت الإضافة محلياً فقط', saved.remote ? 'success' : 'error');
  renderPage('admin');
  lucide.createIcons();
}

async function saveNewLevel() {
  const title = document.getElementById('new-lv-title')?.value?.trim();
  if(!title) {
    showToast('اكتب اسم المستوى أولاً', 'error');
    return;
  }
  const subtitle = document.getElementById('new-lv-subtitle')?.value?.trim() || 'مستوى جديد';
  const list = document.getElementById('new-level-words-list');
  const words = [];
  list?.querySelectorAll('[id^="new-level-word-row-"]').forEach((row) => {
    const fr = row.querySelector(`[id^="new-lv-wfr-"]`)?.value || '';
    const ar = row.querySelector(`[id^="new-lv-war-"]`)?.value || '';
    const example = row.querySelector(`[id^="new-lv-wex-"]`)?.value || '';
    if(fr || ar || example) words.push({ fr, ar, example });
  });
  const nextId = WORD_LEVELS.length ? Math.max(...WORD_LEVELS.map(l => Number(l.id) || 0)) + 1 : 1;
  WORD_LEVELS.push({
    id: nextId,
    sortOrder: WORD_LEVELS.length + 1,
    title,
    subtitle,
    unlocked: nextId === 1,
    updatedAt: Date.now(),
    words: words.length ? words : [{ fr:'', ar:'', example:'' }]
  });
  normalizeWordLevelOrder();
  const saved = await saveWordLevels();
  if(!saved?.ok) return;
  closeModal();
  showToast(saved.remote ? '✅ تم إضافة المستوى' : 'تمت الإضافة محلياً فقط', saved.remote ? 'success' : 'error');
  renderPage('admin');
  lucide.createIcons();
}

  showToast(saved.remote ? '✅ تم حذف المستوى' : 'تم الحذف محلياً فقط', saved.remote ? 'success' : 'error');
  renderPage('admin');
  lucide.createIcons();
}

async function moveLevel(idx, direction) {
  const target = idx + direction;
  if(target < 0 || target >= WORD_LEVELS.length) return;
  const temp = WORD_LEVELS[idx];
  WORD_LEVELS[idx] = WORD_LEVELS[target];
  WORD_LEVELS[target] = temp;
  normalizeWordLevelOrder();
  const saved = await saveWordLevels();
  if(!saved?.ok) return;
  showToast(saved.remote ? '✅ تم تحديث ترتيب المستويات' : 'تم تحديث الترتيب محلياً فقط', saved.remote ? 'success' : 'error');
  renderPage('admin');
  lucide.createIcons();
}

let editingLevelIdx = null;
function addWordRow() {
  const list = document.getElementById('words-list');
  if(!list) return;
  const wi = list.children.length;
  const div = document.createElement('div');
  div.style.cssText='display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-bottom:8px;align-items:center;';
  div.id=`word-row-${wi}`;
  div.innerHTML=`<input class="inp-dark" style="margin:0;" id="wfr-${wi}" placeholder="فرنسي"/>
  <input class="inp-dark" style="margin:0;" id="war-${wi}" placeholder="عربي"/>
  <input class="inp-dark" style="margin:0;" id="wex-${wi}" placeholder="مثال"/>
  <button onclick="this.parentElement.remove()" style="background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#ef4444;padding:8px;cursor:pointer;">✕</button>`;
  list.appendChild(div);
}

function removeWordRow(wi) {
  const el = document.getElementById(`word-row-${wi}`);
  if(el) el.remove();
}

async function saveLevelEdit(idx) {
  const list = document.getElementById('words-list');
  const title = document.getElementById('edit-lv-title')?.value||WORD_LEVELS[idx].title;
  const subtitle = document.getElementById('edit-lv-subtitle')?.value||WORD_LEVELS[idx].subtitle;
  const words = [];
  list?.querySelectorAll('[id^="word-row-"]').forEach((row,i)=>{
    const fr = row.querySelector(`[id^="wfr-"]`)?.value||'';
    const ar = row.querySelector(`[id^="war-"]`)?.value||'';
    const example = row.querySelector(`[id^="wex-"]`)?.value||'';
    if(fr||ar) words.push({fr,ar,example});
  });
  WORD_LEVELS[idx].title=title;
  WORD_LEVELS[idx].subtitle=subtitle;
  if(words.length>0) WORD_LEVELS[idx].words=words;
  WORD_LEVELS[idx].updatedAt = Date.now();
  const saved = await saveWordLevels();
  if(!saved) return;
  closeModal();
  showToast('✅ تم حفظ المستوى','success');
  renderPage('admin');
  lucide.createIcons();
}

function closeModal() {
  const m = document.getElementById('admin-modal');
  if(m) m.style.display='none';
}

function applySiteConfigToUi(config) {
  document.documentElement.style.setProperty('--accent', config.accent_color || '#ff6b35');
  document.body.style.background = config.background_color || '#0f0e17';
  document.body.style.color = config.text_color || '#fffffe';
  document.body.style.fontFamily = (config.font_family || 'Cairo') + ',sans-serif';
  document.body.style.fontSize = (config.font_size || 16) + 'px';
  const titleEl = document.querySelector('.login-title,.nav-logo div div:first-child');
  if(titleEl) titleEl.textContent = config.site_title || 'Français Academy';
}

async function saveAdminSettings() {
  siteConfig = {
    ...siteConfig,
    site_title: document.getElementById('admin-site-title')?.value?.trim() || 'Français Academy',
    welcome_text: document.getElementById('admin-welcome-text')?.value?.trim() || 'تعلم الفرنسية بسهولة',
    accent_color: document.getElementById('admin-accent-color')?.value?.trim() || '#ff6b35',
    background_color: document.getElementById('admin-background-color')?.value?.trim() || '#0f0e17',
    text_color: document.getElementById('admin-text-color')?.value?.trim() || '#fffffe',
    font_family: document.getElementById('admin-font-family')?.value?.trim() || 'Cairo',
    font_size: Number(document.getElementById('admin-font-size')?.value || 16) || 16
  };
  applySiteConfigToUi(siteConfig);
  const saved = await saveSiteConfig();
  if(!saved?.ok) return;
  showToast(saved.remote ? '✅ تم حفظ الإعدادات' : 'تم حفظ الإعدادات محلياً فقط', saved.remote ? 'success' : 'error');
  if(currentPage === 'admin') {
    renderPage('admin');
    lucide.createIcons();
  }
}

// ===================== المكان السري للادمن =====================
function secretAdminClick() {
  adminClickCount++;
  if(adminClickTimer) clearTimeout(adminClickTimer);
  if(adminClickCount>=3) {
    adminClickCount=0;
    if(currentUser?.role!=='admin') {
      // طلب كلمة السر
      showSecretAdminLogin();
    }
  }
  adminClickTimer = setTimeout(()=>{adminClickCount=0;},2000);
}

function showSecretAdminLogin() {
  const modal = document.getElementById('admin-modal');
  const content = document.getElementById('admin-modal-content');
  content.innerHTML=`
  <div style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:12px;">🔐</div>
    <div style="font-weight:700;color:#ff6b35;margin-bottom:20px;">دخول الإدارة</div>
    <input class="inp-dark" type="password" id="admin-secret-pass" placeholder="كلمة سر الإدارة" style="text-align:center;"/>
    <div id="admin-secret-err" style="color:#ef4444;font-size:.85rem;margin-bottom:12px;min-height:20px;"></div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button onclick="checkAdminSecret()" style="padding:12px 24px;background:linear-gradient(135deg,#ff6b35,#f7c59f);border:none;border-radius:10px;color:#0f0e17;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;">دخول</button>
      <button onclick="closeModal()" style="padding:12px 24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-family:'Cairo',sans-serif;cursor:pointer;">إلغاء</button>
    </div>
  </div>`;
  modal.style.display='flex';
}

function checkAdminSecret() {
  const pass = document.getElementById('admin-secret-pass')?.value;
  // كلمة سر الادمن السري
  if(pass==='admin123'||pass===DEMO_USERS['admin@test.com']?.password) {
    currentUser = {...currentUser, role:'admin'};
    localStorage.setItem('currentUser',JSON.stringify(currentUser));
    closeModal();
    showToast('🎉 مرحباً بالمدير!','success');
    setTimeout(()=>{renderApp();navigate('admin');},500);
  } else {
    const err=document.getElementById('admin-secret-err');
    if(err) err.textContent='كلمة السر غير صحيحة';
  }
}

// ===================== Toast =====================
function showToast(msg, type='success') {
  let t = document.getElementById('toast-global');
  if(!t){t=document.createElement('div');t.id='toast-global';document.body.appendChild(t);}
  t.style.cssText=`position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  padding:14px 28px;border-radius:14px;font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:700;
  z-index:9999;transition:all .4s;box-shadow:0 8px 24px rgba(0,0,0,.4);
  background:${type==='success'?'rgba(34,197,94,.9)':'rgba(239,68,68,.9)'};
  color:#fff;border:1px solid ${type==='success'?'rgba(34,197,94,.5)':'rgba(239,68,68,.5)'};`;
  t.textContent=msg;
  t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';},3000);
}

// ===================== الـ SDK =====================
window.elementSdk?.init({
  defaultConfig:{
    site_title: siteConfig.site_title||'Français Academy',
    welcome_text: siteConfig.welcome_text||'تعلم الفرنسية بسهولة',
    background_color: '#0f0e17',
    accent_color: '#ff6b35',
    text_color: '#fffffe',
    surface_color: 'rgba(255,255,255,0.04)',
    font_family: 'Cairo',
    font_size: 16
  },
  onConfigChange: async(config)=>{
    siteConfig={...siteConfig,...config};
    localStorage.setItem('siteConfig',JSON.stringify(siteConfig));
    applySiteConfigToUi(siteConfig);
    await saveSiteConfig();
  },
  mapToCapabilities: (config)=>({
    recolorables:[
      {get:()=>config.background_color||'#0f0e17',set:(v)=>{config.background_color=v;window.elementSdk.setConfig({background_color:v});}},
      {get:()=>config.surface_color||'rgba(255,255,255,0.04)',set:(v)=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v});}},
      {get:()=>config.text_color||'#fffffe',set:(v)=>{config.text_color=v;window.elementSdk.setConfig({text_color:v});}},
      {get:()=>config.accent_color||'#ff6b35',set:(v)=>{config.accent_color=v;window.elementSdk.setConfig({accent_color:v});}},
    ],
    borderables:[],
    fontEditable:{get:()=>config.font_family||'Cairo',set:(v)=>{config.font_family=v;window.elementSdk.setConfig({font_family:v});document.body.style.fontFamily=v+',Cairo,sans-serif';}},
    fontSizeable:{get:()=>config.font_size||16,set:(v)=>{config.font_size=v;window.elementSdk.setConfig({font_size:v});document.body.style.fontSize=v+'px';}}
  }),
  mapToEditPanelValues:(config)=>new Map([
    ['site_title',config.site_title||'Français Academy'],
    ['welcome_text',config.welcome_text||'تعلم الفرنسية بسهولة']
  ])
});

// ===================== البداية =====================
async function bootstrapApp() {
  await loadCustomDictionary();
  if(currentUser) {
    await loadLectures();
    await loadWordLevels();
    await loadSiteConfig();
    await loadUserProgressFromFirebase(currentUser.code);
    subscribeLectures();
    subscribeWordLevels();
    userProgress = JSON.parse(localStorage.getItem('userProgress_' + currentUser.code) || '{}');
    userLevelProgress = JSON.parse(localStorage.getItem('userLevelProgress_' + currentUser.code) || '{}');
    renderApp();
    return;
  }
  renderLogin();
}

bootstrapApp();

window.addEventListener('focus', () => {
  refreshRemoteData();
});

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') {
    refreshRemoteData();
  }
});

</script>
